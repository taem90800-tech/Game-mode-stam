name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p "."
          cat > "README.txt" <<'GAEOF'
          ผู้ช่วยเกม - โปรเจกต์ Android (Kotlin, ไม่มี dependency เพิ่ม)

          วิธีสร้างแอป
          1. ติดตั้ง Android Studio แล้วเลือก File > Open ชี้ไปที่โฟลเดอร์ GameAssistant
          2. รอ Gradle Sync (ครั้งแรกต้องต่ออินเทอร์เน็ต)
          3. ต่อมือถือ (เปิด USB debugging) แล้วกด Run หรือเลือก Build > Build APK(s)

          เมื่อเปิดแอปครั้งแรก ต้องอนุญาต: ไมค์, แจ้งเตือน, แสดงทับแอปอื่น, เข้าถึงห้ามรบกวน
          GAEOF
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'GAEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.gameassistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gameassistant"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          GAEOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'GAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".VoiceService" android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service android:name=".OverlayService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating game stats overlay"/>
                  </service>
              </application>
          </manifest>
          GAEOF
          mkdir -p "app/src/main/java/com/example/gameassistant"
          cat > "app/src/main/java/com/example/gameassistant/MainActivity.kt" <<'GAEOF'
          package com.example.gameassistant

          import android.Manifest
          import android.app.Activity
          import android.app.ActivityManager
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              private val BG = Color.parseColor("#0D1511"); private val PANEL = Color.parseColor("#16211B")
              private val LINE = Color.parseColor("#243229"); private val TEXT = Color.parseColor("#E9F4EC")
              private val MUTE = Color.parseColor("#8DA396"); private val GREEN = Color.parseColor("#7BE35A")

              private val h = Handler(Looper.getMainLooper())
              private lateinit var stats: TextView
              private lateinit var voiceSwitch: Switch
              private lateinit var overlaySwitch: Switch
              private var mode = "normal"
              private val tick = object : Runnable {
                  override fun run() { stats.text = Stats.line(this@MainActivity); h.postDelayed(this, 2000) }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun label(t: String, sp: Float = 15f, c: Int = TEXT) =
                  TextView(this).apply { text = t; textSize = sp; setTextColor(c) }
              private fun card() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(8), dp(14), dp(8))
                  background = GradientDrawable().apply { setColor(PANEL); cornerRadius = dp(14).toFloat(); setStroke(dp(1), LINE) }
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(16) }
              }
              private fun sw(t: String, on: (Boolean) -> Unit) = Switch(this).apply {
                  text = t; textSize = 15f; setTextColor(TEXT); setPadding(0, dp(10), 0, dp(10))
                  setOnCheckedChangeListener { _, c -> on(c) }
              }
              private fun pill(t: String) = Button(this).apply {
                  text = t; setTextColor(GREEN); isAllCaps = false
                  background = GradientDrawable().apply { setColor(Color.TRANSPARENT); cornerRadius = 100f; setStroke(dp(1), GREEN) }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(40), dp(16), dp(32)) }
                  setContentView(ScrollView(this).apply { setBackgroundColor(BG); addView(col) })

                  col.addView(label("ผู้ช่วยเกม", 24f))
                  col.addView(label("เครื่องพร้อมเล่นเกม", 13f, MUTE))

                  val boost = pill("เร่งเครื่อง  (ล้างแรม)").apply {
                      textSize = 20f; setPadding(0, dp(22), 0, dp(22))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(20); bottomMargin = dp(12) }
                      setOnClickListener { boost(this) }
                  }
                  col.addView(boost)
                  stats = label(Stats.line(this), 14f, MUTE).apply { gravity = Gravity.CENTER; setPadding(0, 0, 0, dp(16)) }
                  col.addView(stats)

                  col.addView(label("ตั้งค่าขณะเล่นเกม", 14f, MUTE))
                  val opts = card()
                  opts.addView(sw("ห้ามรบกวน (ปิดเสียงแจ้งเตือน)") { setDnd(it) })
                  overlaySwitch = sw("แถบสถานะลอย (แรม/อุณหภูมิ/แบต)") { setOverlay(it) }
                  opts.addView(overlaySwitch)
                  col.addView(opts)

                  col.addView(label("เปลี่ยนเสียง", 14f, MUTE))
                  val vc = card()
                  voiceSwitch = sw("เปิดระบบเปลี่ยนเสียง (ควรใช้หูฟัง)") { setVoice(it) }
                  vc.addView(voiceSwitch)
                  val rg = RadioGroup(this)
                  listOf("normal" to "ปกติ", "kid" to "เสียงเด็ก", "deep" to "เสียงทุ้ม", "robot" to "หุ่นยนต์", "echo" to "เสียงก้อง")
                      .forEachIndexed { i, (k, n) ->
                          rg.addView(RadioButton(this).apply { id = 100 + i; text = n; setTextColor(TEXT); isChecked = i == 0
                              setOnClickListener { mode = k; if (voiceSwitch.isChecked) sendVoice() } })
                      }
                  vc.addView(rg); col.addView(vc)

                  col.addView(label("เกมของฉัน", 14f, MUTE))
                  val games = card(); col.addView(games)
                  val pm = packageManager
                  val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                      .map { it.activityInfo.applicationInfo }.filter { it.packageName != packageName }.distinctBy { it.packageName }
                  var list = apps.filter { it.category == ApplicationInfo.CATEGORY_GAME }
                  if (list.isEmpty()) list = apps.filter { it.flags and ApplicationInfo.FLAG_SYSTEM == 0 }
                  list.forEach { ai ->
                      val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(6), 0, dp(6)) }
                      row.addView(label(pm.getApplicationLabel(ai).toString()).apply {
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f) })
                      row.addView(pill("เล่น").apply { setOnClickListener { play(ai.packageName) } })
                      games.addView(row)
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 2)
              }

              override fun onResume() { super.onResume(); h.post(tick) }
              override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

              private fun boost(b: Button) {
                  val before = Stats.availMb(this)
                  b.text = "กำลังเร่ง…"
                  val am = getSystemService(ACTIVITY_SERVICE) as ActivityManager
                  packageManager.getInstalledApplications(0)
                      .filter { it.flags and ApplicationInfo.FLAG_SYSTEM == 0 && it.packageName != packageName }
                      .forEach { am.killBackgroundProcesses(it.packageName) }
                  h.postDelayed({
                      val freed = (Stats.availMb(this) - before).coerceAtLeast(0)
                      b.text = "เร่งเครื่อง  (ล้างแรม)"
                      Toast.makeText(this, "ล้างแรมได้ $freed MB", Toast.LENGTH_SHORT).show()
                  }, 1500)
              }

              private fun setDnd(on: Boolean) {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (!nm.isNotificationPolicyAccessGranted) {
                      Toast.makeText(this, "กรุณาอนุญาตการเข้าถึงห้ามรบกวน", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)); return
                  }
                  nm.setInterruptionFilter(if (on) NotificationManager.INTERRUPTION_FILTER_NONE else NotificationManager.INTERRUPTION_FILTER_ALL)
              }

              private fun setOverlay(on: Boolean) {
                  if (on && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "กรุณาอนุญาตการแสดงทับแอปอื่น", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      overlaySwitch.isChecked = false; return
                  }
                  val i = Intent(this, OverlayService::class.java)
                  if (on) startForegroundService(i) else startService(i.setAction("stop"))
              }

              private fun setVoice(on: Boolean) {
                  if (!on) { startService(Intent(this, VoiceService::class.java).setAction("stop")); return }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1) else sendVoice()
              }

              private fun sendVoice() = startForegroundService(Intent(this, VoiceService::class.java).putExtra("mode", mode))

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  if (code == 1) { if (r.firstOrNull() == PackageManager.PERMISSION_GRANTED) sendVoice() else voiceSwitch.isChecked = false }
              }

              private fun play(pkg: String) {
                  if (Settings.canDrawOverlays(this)) overlaySwitch.isChecked = true
                  packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
              }
          }
          GAEOF
          mkdir -p "app/src/main/java/com/example/gameassistant"
          cat > "app/src/main/java/com/example/gameassistant/OverlayService.kt" <<'GAEOF'
          package com.example.gameassistant

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import kotlin.math.abs

          /** แถบสถานะลอยเหนือเกม ลากย้ายได้ แตะเพื่อกลับมาที่แอป */
          class OverlayService : Service() {
              private var wm: WindowManager? = null
              private var tv: TextView? = null
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { tv?.text = Stats.line(this@OverlayService); h.postDelayed(this, 2000) }
              }

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  if (i?.action == "stop") { stopSelf(); return START_NOT_STICKY }
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("ga", "ผู้ช่วยเกม", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ga").setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("ผู้ช่วยเกม").setContentText("แถบสถานะลอยกำลังทำงาน").build()
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(2, n)
                  if (tv == null) addOverlay()
                  return START_NOT_STICKY
              }

              private fun addOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val d = resources.displayMetrics.density
                  val v = TextView(this).apply {
                      setTextColor(Color.parseColor("#7BE35A")); textSize = 12f
                      setPadding((12 * d).toInt(), (6 * d).toInt(), (12 * d).toInt(), (6 * d).toInt())
                      background = GradientDrawable().apply { setColor(Color.parseColor("#CC0D1511")); cornerRadius = 40f }
                      text = Stats.line(this@OverlayService)
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 24; y = 120 }
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0; var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              if (abs(e.rawX - dx) > 10 || abs(e.rawY - dy) > 10) moved = true
                              lp.x = sx + (e.rawX - dx).toInt(); lp.y = sy + (e.rawY - dy).toInt()
                              wm?.updateViewLayout(v, lp)
                          }
                          MotionEvent.ACTION_UP -> if (!moved) startActivity(
                              Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                      true
                  }
                  wm?.addView(v, lp); tv = v; h.post(tick)
              }

              override fun onDestroy() {
                  h.removeCallbacks(tick); tv?.let { wm?.removeView(it) }; tv = null; super.onDestroy()
              }
              override fun onBind(i: Intent?): IBinder? = null
          }
          GAEOF
          mkdir -p "app/src/main/java/com/example/gameassistant"
          cat > "app/src/main/java/com/example/gameassistant/Stats.kt" <<'GAEOF'
          package com.example.gameassistant

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager

          object Stats {
              fun ramPercent(c: Context): Int {
                  val mi = ActivityManager.MemoryInfo()
                  (c.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(mi)
                  return (100 - mi.availMem * 100 / mi.totalMem).toInt()
              }
              fun availMb(c: Context): Long {
                  val mi = ActivityManager.MemoryInfo()
                  (c.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(mi)
                  return mi.availMem / 1048576
              }
              fun line(c: Context): String {
                  val b: Intent? = c.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val temp = (b?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10.0
                  val lv = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) ?: 0
                  return "แรม ${ramPercent(c)}%  ·  ${"%.1f".format(temp)}°C  ·  แบต $lv%"
              }
          }
          GAEOF
          mkdir -p "app/src/main/java/com/example/gameassistant"
          cat > "app/src/main/java/com/example/gameassistant/VoiceEngine.kt" <<'GAEOF'
          package com.example.gameassistant

          import android.annotation.SuppressLint
          import android.media.*
          import kotlin.math.PI
          import kotlin.math.sin

          /** รับเสียงจากไมค์ แล้วเล่นออกทันทีพร้อมเอฟเฟกต์ (ควรใช้หูฟังเพื่อกันเสียงหอน) */
          class VoiceEngine {
              @Volatile var mode = "normal"
              @Volatile private var running = false
              private var thread: Thread? = null

              @SuppressLint("MissingPermission")
              fun start() {
                  if (running) return
                  running = true
                  thread = Thread {
                      val sr = 16000
                      val minIn = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val rec = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sr,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minIn * 2)
                      val minOut = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setSampleRate(sr)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(minOut * 2)
                          .setTransferMode(AudioTrack.MODE_STREAM).build()
                      val buf = ShortArray(512)
                      val echo = ShortArray(sr / 4)
                      var ei = 0
                      var t = 0L
                      rec.startRecording(); track.play()
                      while (running) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n <= 0) continue
                          val m = mode
                          val f = when (m) { "kid" -> 1.4; "deep" -> 0.75; else -> 1.0 }
                          val len = (n / f).toInt().coerceAtLeast(1)
                          val out = ShortArray(len)
                          for (i in 0 until len) {
                              val p = i * f
                              val a = p.toInt().coerceAtMost(n - 1)
                              val b = (a + 1).coerceAtMost(n - 1)
                              var s = buf[a] + (buf[b] - buf[a]) * (p - a)
                              if (m == "robot") s *= sin(2 * PI * 50 * (t++) / sr)
                              if (m == "echo") {
                                  s += echo[ei] * 0.45
                                  echo[ei] = s.coerceIn(-32768.0, 32767.0).toInt().toShort()
                                  ei = (ei + 1) % echo.size
                              }
                              out[i] = s.coerceIn(-32768.0, 32767.0).toInt().toShort()
                          }
                          track.write(out, 0, len)
                      }
                      rec.stop(); rec.release(); track.stop(); track.release()
                  }.also { it.start() }
              }

              fun stop() { running = false; thread?.join(500); thread = null }
          }
          GAEOF
          mkdir -p "app/src/main/java/com/example/gameassistant"
          cat > "app/src/main/java/com/example/gameassistant/VoiceService.kt" <<'GAEOF'
          package com.example.gameassistant

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class VoiceService : Service() {
              private val engine = VoiceEngine()

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  if (i?.action == "stop") { stopSelf(); return START_NOT_STICKY }
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("ga", "ผู้ช่วยเกม", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "ga").setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("ผู้ช่วยเกม").setContentText("ระบบเปลี่ยนเสียงกำลังทำงาน").build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
                  engine.mode = i?.getStringExtra("mode") ?: "normal"
                  engine.start()
                  return START_NOT_STICKY
              }

              override fun onDestroy() { engine.stop(); super.onDestroy() }
              override fun onBind(i: Intent?): IBinder? = null
          }
          GAEOF
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_launcher.xml" <<'GAEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#0D1511" android:pathData="M22,0H78A22,22 0 0 1 100,22V78A22,22 0 0 1 78,100H22A22,22 0 0 1 0,78V22A22,22 0 0 1 22,0Z"/>
              <path android:fillColor="#6FD34E" android:pathData="M50,14L80,31V69L50,86L20,69V31Z"/>
              <path android:strokeColor="#0D1511" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M50,50V70M50,50L33,40M50,50L67,40"/>
          </vector>
          GAEOF
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/strings.xml" <<'GAEOF'
          <resources><string name="app_name">ผู้ช่วยเกม</string></resources>
          GAEOF
          mkdir -p "."
          cat > "build.gradle.kts" <<'GAEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          GAEOF
          mkdir -p "."
          cat > "gradle.properties" <<'GAEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          GAEOF
          mkdir -p "."
          cat > "settings.gradle.kts" <<'GAEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GameAssistant"
          include(":app")
          GAEOF
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: GameAssistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GameAssistant.apk
